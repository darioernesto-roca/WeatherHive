[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/weather"
  to = "/.netlify/functions/weather"
  status = 200

[[redirects]]
  from = "/api/forecast"
  to = "/.netlify/functions/forecast"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
